services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-health-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_health_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_health_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ai-health-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ai_health_assistant
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
